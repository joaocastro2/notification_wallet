server:
  port: ${PORT:8083}

spring:
  application:
    name: notification-wallet

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

    properties:
      spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      spring.json.trusted.packages: "*"
      spring.json.use.type.headers: false

    topics:
      user-created: ${USER_CREATED_TOPIC:user-created-topic}
      transaction-created: ${TRANSACTION_CREATED_TOPIC:transaction-created-topic}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

kafka:
  topics:
    user-created: ${USER_CREATED_TOPIC:user-created-topic}
    transaction-created: ${TRANSACTION_CREATED_TOPIC:transaction-created-topic}

notification:
  mail:
    from: ${MAIL_FROM:no-reply@wallet.com}
    default-recipient: ${NOTIFICATION_DEFAULT_RECIPIENT:notifications@wallet.com}
