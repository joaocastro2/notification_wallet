server:
  port: ${PORT:8083}

spring:
  application:
    name: notification-wallet

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    properties:
      spring.json.trusted.packages: "*"

  mail:
    host: ${MAIL_HOST:${SPRING_MAIL_HOST:localhost}}
    port: ${MAIL_PORT:${SPRING_MAIL_PORT:1025}}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

kafka:
  topics:
    user-created: ${USER_CREATED_TOPIC:user-created-topic}
    transaction-created: ${TRANSACTION_CREATED_TOPIC:transaction-created-topic}

notification:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@wallet.com}}
    from-name: "${MAIL_FROM_NAME:Wallet | João Castro}"
    reply-to: ${MAIL_REPLY_TO:}
    default-recipient: ${NOTIFICATION_DEFAULT_RECIPIENT:${MAIL_USERNAME:notifications@wallet.com}}
